
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#20252B"/>
      <stop offset="1" stop-color="#080A0D"/>
    </linearGradient>
    <linearGradient id="metal" x2="1" y2="0">
      <stop stop-color="#87929D"/>
      <stop offset=".5" stop-color="#F2F4F6"/>
      <stop offset="1" stop-color="#A1ABB5"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#B9C3CC" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1000" height="590" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="590" rx="16" fill="url(#grid)"/>

  <text x="42" y="55" fill="#87929D" font-family="monospace" font-size="12" letter-spacing="4">TECHNICAL SPECIFICATION / 004</text>
  <text x="42" y="105" fill="url(#metal)" font-family="Arial" font-size="36" font-weight="bold">TECHNOLOGY STACK</text>
  <text x="42" y="137" fill="#AAB3BC" font-family="monospace" font-size="13">TOOLS AND TECHNOLOGIES I WORK WITH</text>

  <!-- Programming -->
  <rect x="35" y="170" width="450" height="155" rx="12" fill="#171C21" stroke="#AEB8C2" stroke-opacity=".45"/>
  <text x="60" y="205" fill="#DCE1E6" font-family="monospace" font-size="14" letter-spacing="2">01 / PROGRAMMING</text>
  <path d="M60 219H455" stroke="#89949E" stroke-opacity=".4"/>
  <g fill="url(#metal)" font-family="monospace" font-size="17" font-weight="bold">
    <text x="65" y="260">JAVA</text>
    <text x="190" y="260">C</text>
    <text x="275" y="260">PYTHON</text>
    <text x="65" y="295">JAVASCRIPT</text>
    <text x="275" y="295">TYPESCRIPT</text>
  </g>

  <!-- Database -->
  <rect x="515" y="170" width="450" height="155" rx="12" fill="#171C21" stroke="#AEB8C2" stroke-opacity=".45"/>
  <text x="540" y="205" fill="#DCE1E6" font-family="monospace" font-size="14" letter-spacing="2">02 / DATABASE &amp; BACKEND</text>
  <path d="M540 219H935" stroke="#89949E" stroke-opacity=".4"/>
  <g fill="url(#metal)" font-family="monospace" font-size="17" font-weight="bold">
    <text x="545" y="260">MYSQL</text>
    <text x="700" y="260">SQL</text>
    <text x="545" y="295">SUPABASE</text>
    <text x="700" y="295">DRIZZLE ORM</text>
  </g>

  <!-- Web -->
  <rect x="35" y="350" width="450" height="155" rx="12" fill="#171C21" stroke="#AEB8C2" stroke-opacity=".45"/>
  <text x="60" y="385" fill="#DCE1E6" font-family="monospace" font-size="14" letter-spacing="2">03 / WEB DEVELOPMENT</text>
  <path d="M60 399H455" stroke="#89949E" stroke-opacity=".4"/>
  <g fill="url(#metal)" font-family="monospace" font-size="16" font-weight="bold">
    <text x="65" y="440">HTML</text>
    <text x="190" y="440">CSS</text>
    <text x="275" y="440">NEXT.JS</text>
    <text x="65" y="475">TAILWIND</text>
    <text x="275" y="475">VERCEL</text>
  </g>

  <!-- Tools -->
  <rect x="515" y="350" width="450" height="155" rx="12" fill="#171C21" stroke="#AEB8C2" stroke-opacity=".45"/>
  <text x="540" y="385" fill="#DCE1E6" font-family="monospace" font-size="14" letter-spacing="2">04 / TOOLS &amp; AI</text>
  <path d="M540 399H935" stroke="#89949E" stroke-opacity=".4"/>
  <g fill="url(#metal)" font-family="monospace" font-size="16" font-weight="bold">
    <text x="545" y="440">GIT</text>
    <text x="700" y="440">GITHUB</text>
    <text x="545" y="475">OPENAI</text>
    <text x="700" y="475">GEMINI</text>
  </g>

  <path d="M35 535H965" stroke="#AEB8C2" stroke-opacity=".35"/>
  <text x="42" y="560" fill="#89949F" font-family="monospace" font-size="11" letter-spacing="2">CONTINUOUSLY LEARNING / CONSTANTLY BUILDING</text>
  <text x="955" y="560" text-anchor="end" fill="#C0C7CE" font-family="monospace" font-size="11">PS / 004</text>
</svg>
